# Pull request'lerde yalnızca test + derleme (sürüm yayınlamaz).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode seç
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Proje üret
        run: brew install xcodegen && xcodegen generate
      - name: Test
        run: xcodebuild test -project Burrow.xcodeproj -scheme Burrow -destination 'platform=macOS' -quiet
